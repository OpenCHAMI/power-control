name: Run Integration Tests
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
jobs:
  run_integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        storage:
          - MEMORY
          - ETCD
          - POSTGRES
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run integration tests
        env:
          STORAGE: ${{ matrix.storage }}
        run: make integration
