networks:
  pcs:

x-rfemulator-healthcheck: &rfemulator-healthcheck
  test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://127.0.0.1/redfish/v1/"]
  interval: 2s
  timeout: 2s
  retries: 30
  start_period: 5s

services:

  #
  # Required services
  #
  etcd:
    image: quay.io/coreos/etcd:v3.7.1
    environment:
      - ETCD_UNSUPPORTED_ARCH=arm64
      - ALLOW_NONE_AUTHENTICATION=yes
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - pcs

  vault:
    hostname: vault
    image: docker.io/library/vault:1.13.3
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=hms
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_ADDR=http://127.0.0.1:8200
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - pcs

  vault-kv-enabler:
    build:
      context: .
      dockerfile: vault-kv-enabler.dockerfile
    environment:
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=hms
      - KV_STORES=hms-creds
    depends_on:
      vault:
        condition: service_healthy
    networks:
      - pcs

  postgres-smd:
    hostname: postgres-smd
    image: docker.io/library/postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=hmsds
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - pcs

  smd-init:
    image: ghcr.io/openchami/smd:2.20
    environment:
      - SMD_DBHOST=postgres-smd
      - SMD_DBPORT=5432
      - SMD_DBNAME=hmsds
      - SMD_DBUSER=${POSTGRES_USER:-postgres}
      - SMD_DBPASS=${POSTGRES_PASSWORD:-postgres}
      - SMD_DBOPTS=sslmode=disable
    depends_on:
      postgres-smd:
        condition: service_healthy
    networks:
      - pcs
    command: /smd-init

  smd:
    image: ghcr.io/openchami/smd:2.20
    environment:
      - SMD_DBHOST=postgres-smd
      - SMD_DBPORT=5432
      - SMD_DBNAME=hmsds
      - SMD_DBUSER=${POSTGRES_USER:-postgres}
      - SMD_DBPASS=${POSTGRES_PASSWORD:-postgres}
      - SMD_DBOPTS=sslmode=disable
      - SMD_JWKS_URL=
      - RF_MSG_HOST=kafka:9092:cray-dmtf-resource-event
      - CRAY_VAULT_AUTH_PATH=auth/token/create
      - CRAY_VAULT_ROLE_FILE=configs/namespace
      - CRAY_VAULT_JWT_FILE=configs/token
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=hms
      - VAULT_KEYPATH=hms-creds
      - SMD_WVAULT=true
      - SMD_RVAULT=true
      - SMD_SLS_HOST=
      - SMD_HBTD_HOST=
      - ENABLE_DISCOVERY=true
    volumes:
      - ./configs/namespace:/configs/namespace
      - ./configs/token:/configs/token
    hostname: smd
    depends_on:
      smd-init:
        condition: service_completed_successfully
      vault-kv-enabler:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:27779/hsm/v2/service/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - pcs

  #
  # Emulated hardware
  #
  # Note: Several PCS power-cap tests assume that all compute nodes in HSM
  # have Node Power Limit controls and do not have Accelerator Power Limit
  # controls, so the following RIE instances should only emulate node types
  # that fit this criteria. Otherwise test failures may occur.
  #
  emulator-loader:
    image: docker.io/library/golang:1.27-alpine
    command: >
      sh -ec "apk add --no-cache curl &&
      curl --fail --show-error --silent
      -H 'Content-Type: application/json' -X POST -d '{\"RedfishEndpoints\":[{
        \"ID\":\"x0c0b0\",
        \"FQDN\":\"x0c0b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s0b0\",
        \"FQDN\":\"x0c0s0b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s1b0\",
        \"FQDN\":\"x0c0s1b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s2b0\",
        \"FQDN\":\"x0c0s2b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s3b0\",
        \"FQDN\":\"x0c0s3b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s4b0\",
        \"FQDN\":\"x0c0s4b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s5b0\",
        \"FQDN\":\"x0c0s5b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s6b0\",
        \"FQDN\":\"x0c0s6b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      },{
        \"ID\":\"x0c0s7b0\",
        \"FQDN\":\"x0c0s7b0\",
        \"RediscoverOnUpdate\":true,
        \"User\":\"root\",
        \"Password\":\"root_password\"
      }]}' http://smd:27779/hsm/v2/Inventory/RedfishEndpoints"
    depends_on:
      smd:
        condition: service_healthy
      vault-kv-enabler:
        condition: service_completed_successfully
      rfemulator0:
        condition: service_healthy
      rfemulator1:
        condition: service_healthy
      rfemulator2:
        condition: service_healthy
      rfemulator3:
        condition: service_healthy
      rfemulator4:
        condition: service_healthy
      rfemulator5:
        condition: service_healthy
      rfemulator6:
        condition: service_healthy
      rfemulator7:
        condition: service_healthy
      rfemulator8:
        condition: service_healthy
    networks:
      - pcs

  rfemulator0:
    hostname: x0c0s0b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s0b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s0b0

  rfemulator1:
    hostname: x0c0s1b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s1b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s1b0

  rfemulator2:
    hostname: x0c0s2b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s2b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s2b0

  rfemulator3:
    hostname: x0c0s3b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s3b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s3b0

  rfemulator4:
    hostname: x0c0s4b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s4b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s4b0

  rfemulator5:
    hostname: x0c0s5b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s5b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s5b0

  rfemulator6:
    hostname: x0c0s6b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s6b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s6b0

  rfemulator7:
    hostname: x0c0s7b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=EX425
      - MAC_SCHEMA=Mountain
      - XNAME=x0c0s7b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0s7b0

  rfemulator8:
    hostname: x0c0b0
    image: ghcr.io/openchami/csm-rie:v1.6.7
    environment:
      - MOCKUPFOLDER=CMM
      - XNAME=x0c0b0
      - PORT=443
    healthcheck: *rfemulator-healthcheck
    networks:
      pcs:
        aliases:
          - x0c0b0

  postgres-pcs:
    hostname: postgres-pcs
    image: docker.io/library/postgres:18-alpine
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_DB=pcsdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - pcs

  power-control-init:
    build:
      context: .
      dockerfile: Dockerfile.ct.Dockerfile
    command: ["power-control", "init-postgres"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=postgres-pcs
      - POSTGRES_INSECURE=1
    depends_on:
      postgres-pcs:
        condition: service_healthy
    networks:
      - pcs

  #
  # Service under test
  #
  power-control:
    build:
      context: .
      dockerfile: Dockerfile.ct.Dockerfile
    environment:
      - SMS_SERVER=http://smd:27779
      - CRAY_VAULT_AUTH_PATH=auth/token/create
      - CRAY_VAULT_ROLE_FILE=configs/namespace
      - CRAY_VAULT_JWT_FILE=configs/token
      - VAULT_ADDR=http://vault:8200
      - VAULT_TOKEN=hms
      - VAULT_KEYPATH=hms-creds
      - VAULT_SKIP_VERIFY=true
      - VAULT_ENABLED=true
      - LOG_LEVEL=DEBUG
      - TRS_IMPLEMENTATION=LOCAL
      - HSMLOCK_ENABLED=true
      - STORAGE=ETCD
      - ETCD_HOST=etcd
      - ETCD_PORT=2379
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_HOST=postgres-pcs
      - POSTGRES_INSECURE=1
      - PCS_POWER_SAMPLE_INTERVAL=5
      - STORAGE=${STORAGE:-ETCD}
    depends_on:
      etcd:
        condition: service_healthy
      smd:
        condition: service_healthy
      vault-kv-enabler:
        condition: service_completed_successfully
      emulator-loader:
        condition: service_completed_successfully
      wait-for-smd:
        condition: service_completed_successfully
      power-control-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:28007/readiness"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    networks:
      - pcs

  #
  # Tests
  #
  wait-for-smd:
    build:
      context: test/ct/
      dockerfile: Dockerfile.wait-for-smd.Dockerfile
    depends_on:
      smd:
        condition: service_healthy
      emulator-loader:
        condition: service_completed_successfully
    networks:
      - pcs

  tavern:
    build:
      context: test/ct/
      dockerfile: Dockerfile
    entrypoint: entrypoint.sh tavern -c /src/app/tavern_global_config_ct_test_emulated_hardware.yaml -p /src/app/api
    depends_on:
      power-control:
        condition: service_healthy
    networks:
      - pcs

  smoke:
    build:
      context: test/ct/
      dockerfile: Dockerfile
    entrypoint: entrypoint.sh smoke -f /src/app/smoke.json -u http://power-control:28007
    depends_on:
      power-control:
        condition: service_healthy
    networks:
      - pcs
